name: Build Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Fix gradlew
        working-directory: ParasiteMimic
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build with Gradle
        working-directory: ParasiteMimic
        env:
          GRADLE_OPTS: "-Xmx4G -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false"
        run: ./gradlew clean build --no-daemon --stacktrace --info

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ParasiteMimic-JAR
          path: ParasiteMimic/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
          
