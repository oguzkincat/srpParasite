name: Build Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./ParasiteMimic

    - name: Build with Gradle
      run: ./gradlew build
      working-directory: ./ParasiteMimic

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: ParasiteMimic-JAR
        path: ParasiteMimic/build/libs/*.jar
